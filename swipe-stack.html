<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#24100d">
    <title>滑动叠堡 · 汉堡小馆</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./swipe-stack.css?v=20260826-orderbelt47">
  </head>
  <body>
    <main class="swipe-stack-app">
      <header class="swipe-stack-header">
        <a href="./index.html" class="back-button" aria-label="返回汉堡小馆">
          <span aria-hidden="true">←</span>
          <span>返回</span>
        </a>
        <div class="swipe-stack-title">
          <small>新玩法 · 手指投料</small>
          <h1>滑动叠堡</h1>
        </div>
        <div class="layer-counter" aria-label="已完成订单数">
          <small>出餐</small>
          <strong id="served-count">0</strong>
        </div>
      </header>

      <section class="swipe-stack-workspace" aria-label="三订单传送带汉堡台">
        <section class="swipe-stack-stage" aria-label="把食材拖到三个订单口之一">
          <div class="order-dock-row" id="order-dock-row" aria-label="三个订单过滤口"></div>
          <canvas id="swipe-stack-canvas" aria-label="固定视角三维汉堡堆叠舞台">
            你的浏览器需要支持 WebGL 才能使用三维叠堡玩法。
          </canvas>
          <div class="impact-label" id="impact-label" aria-live="polite" hidden>
            <span aria-hidden="true"></span>
            <strong>接住了！</strong>
          </div>
          <div class="serve-label" id="serve-label" aria-live="polite" hidden>完成出餐</div>
          <div class="stack-readout">
            <span>分数 <strong id="score-value">0</strong></span>
            <span>连击 <strong id="combo-value">0</strong></span>
          </div>
          <p class="stage-hint" id="stage-hint" aria-live="polite">
            食材从底部传送带进入，向上拖到对应订单口
          </p>
          <div class="stage-error" id="stage-error" role="alert" hidden>
            三维舞台启动失败，请刷新后重试。
          </div>
        </section>
      </section>

      <aside class="ingredient-launcher" aria-labelledby="ingredient-launcher-title">
        <div class="launcher-heading">
          <div>
            <small>从右向左积料</small>
            <h2 id="ingredient-launcher-title">底部食材带</h2>
          </div>
          <strong id="supply-count">0/6</strong>
        </div>
        <div
          class="ingredient-rail-window"
          id="ingredient-rail-window"
          tabindex="0"
          role="listbox"
          aria-label="底部横向食材供给带。按住任意食材向上拖到订单口"
        >
          <div class="ingredient-rail" id="ingredient-rail"></div>
          <p class="belt-empty-state" id="belt-empty-state">空带待机 · 新食材从右侧进入</p>
          <div class="rail-launch-arrow" aria-hidden="true"><i></i><i></i><i></i></div>
          <div class="rail-source-gate" aria-hidden="true"><span>新料</span></div>
        </div>
      </aside>

      <nav class="swipe-stack-actions" aria-label="滑动叠堡操作">
        <button type="button" id="undo-button" disabled>撤销</button>
        <button type="button" id="reset-button">重来</button>
        <div class="auto-serve-status"><small>自动出餐</small><strong id="active-order-name">订单 1</strong></div>
      </nav>
    </main>
    <script type="module" src="./swipe-stack-app.mjs?v=20260826-orderbelt47"></script>
  </body>
</html>
