<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#211634">
    <title>女巫的毒药：零食乱斗篇</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctitle%3E%E9%A4%90%E7%9B%98%3C/title%3E%3Ccircle cx='32' cy='32' r='30' fill='%23704bd0'/%3E%3Cellipse cx='32' cy='35' rx='23' ry='15' fill='%23fff4d8' stroke='%23241832' stroke-width='4'/%3E%3Cpath d='M18 34h28M22 30q10-13 20 0' fill='none' stroke='%23ff5a4f' stroke-width='5' stroke-linecap='round'/%3E%3Cpath d='M24 35h16' stroke='%23ffc940' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="stylesheet" href="/static/character-reaction.css">
  </head>
  <body>
    <div class="ambient ambient--one" aria-hidden="true"></div>
    <div class="ambient ambient--two" aria-hidden="true"></div>
    <main class="game-shell" id="app">
      <section class="screen home-screen" aria-labelledby="game-title">
        <p class="eyebrow">双人心理战 · 一局两分钟</p>
        <div class="brand-mark" aria-hidden="true"><span>🍽️</span></div>
        <h1 id="game-title">女巫的毒药</h1>
        <p class="subtitle">零食乱斗篇</p>
        <p class="tagline">同一盘公共零食，各自秘密埋伏。</p>
        <div class="home-actions">
          <button class="button button--practice" type="button" data-action="start-practice">
            <span class="button__icon">🎮</span>
            <span class="button__copy"><strong>单人练习</strong><small>立即对战电脑吃货</small></span>
          </button>
          <button class="button button--primary" type="button" data-action="quick-match">
            <span class="button__icon">⚡</span><span>快速匹配</span>
          </button>
          <button class="button button--secondary" type="button" data-action="create-room">
            <span class="button__icon">✦</span><span>邀请好友</span>
          </button>
        </div>
        <form class="join-form" data-action="join-room">
          <label for="room-code">已有房间码</label>
          <div class="join-form__row">
            <input id="room-code" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="输入 6 位数字" autocomplete="off" required>
            <button class="button button--small" type="submit">加入</button>
          </div>
        </form>
      </section>
    </main>
    <p class="toast" id="live-status" role="status" aria-live="polite"></p>
    <script type="module" src="/static/app.js"></script>
  </body>
</html>
